<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Visor de colonoscopia · UACANet</title>
<style>
  :root {
    --bg:#13181c; --panel:#1c242a; --line:#2f3b43; --text:#e9eef1; --muted:#93a1ab;
    --accent:#2fb5a8; --warn:#e8b04a; --ok:#6fcf97;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--text); font:14px/1.4 "Segoe UI",system-ui,sans-serif; }
  body { padding:env(safe-area-inset-top,0) 14px env(safe-area-inset-bottom,0); }
  header { display:flex; align-items:baseline; gap:16px; padding:14px 0 10px; }
  h1 { font-size:18px; margin:0; font-weight:600; }
  #status { color:var(--muted); font-size:13px; }
  main { display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:12px; }
  @media (max-width:900px){ main{grid-template-columns:1fr;} }
  .views { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  @media (max-width:700px){ .views{grid-template-columns:1fr;} }
  figure { margin:0; background:#000; border:1px solid var(--line); border-radius:6px; overflow:hidden; position:relative; }
  figcaption { position:absolute; top:6px; left:8px; font-weight:600; text-shadow:0 1px 3px #000; }
  video,canvas#out { display:block; margin:0 auto; background:#000; max-width:100%; }  /* el tamaño lo fija fit() en JS */
  figure { min-width:0; }
  .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; background:var(--panel);
         border:1px solid var(--line); border-radius:6px; padding:10px; margin-top:8px; }
  button,label.btn { background:#2d3a43; color:var(--text); border:0; border-radius:5px; padding:8px 12px;
         font:inherit; cursor:pointer; }
  button:hover,label.btn:hover { background:#3b4b56; }
  button:focus-visible,input:focus-visible,label.btn:focus-within { outline:2px solid var(--accent); outline-offset:2px; }
  button.on { background:#25574f; }
  input[type=range] { accent-color:var(--accent); }
  #thr { width:160px; }
  aside { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:10px;
          max-height:80vh; overflow:auto; }
  aside h2 { font-size:14px; margin:0 0 8px; }
  .find { display:flex; gap:8px; align-items:center; padding:6px 0; border-top:1px solid var(--line); cursor:pointer; }
  .find img { width:96px; height:64px; object-fit:cover; border-radius:3px; }
  .empty { color:var(--muted); }
  #badge { margin-left:auto; padding:4px 10px; border-radius:99px; background:#2d3a43; }
  #badge.hit { background:#7a2f3a; }
  button.warn { background:#765d20; }
  a.btn { background:#2d3a43; color:var(--text); border-radius:5px; padding:8px 12px; text-decoration:none; }
  a.btn:hover { background:#3b4b56; }
  .tag { font-weight:600; } .tag.manual { color:#ffd700; } .tag.automatico { color:var(--ok); }
  [hidden] { display:none !important; }
  .muted { color:var(--muted); }
  #login { max-width:340px; margin:12vh auto 0; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:24px; }
  #login form { display:grid; gap:8px; margin-top:12px; }
  #login input { background:#10161a; color:var(--text); border:1px solid var(--line); border-radius:5px; padding:9px; font:inherit; }
  #login button { margin-top:8px; background:#167d82; }
  #login-err { color:#ff8a8a; min-height:1.2em; margin:4px 0 0; }
  #logout { margin-left:6px; }
  .views.solo { grid-template-columns:1fr; }
  main.noaside { grid-template-columns:minmax(0,1fr); }
  main.noaside aside { display:none; }
  .bar input[type=text], .bar select, .bar textarea { background:#10161a; color:var(--text); border:1px solid var(--line);
         border-radius:5px; padding:7px; font:inherit; }
  #nota { flex:1; min-width:240px; resize:vertical; }
  #mic.on { background:#7a2f3a; }
  #micst { flex-basis:100%; }
  #micst.err { color:#ff9a9a; }
  #target { flex-basis:100%; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  #target b { color:var(--accent); }
  #target button { padding:3px 9px; font-size:13px; }
  .find { border-radius:4px; }
  .find > span { min-width:0; flex:1; }
  .find:hover { background:#232e35; }
  .find.sel { background:#1f3a38; outline:2px solid var(--accent); outline-offset:-2px; }
  .fnote { display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
           margin-top:3px; color:var(--muted); font-size:12px; overflow-wrap:anywhere; }
  .find .nhint { color:var(--warn); font-size:12px; }
  #sync { padding:4px 10px; border-radius:99px; background:#2d3a43; font-size:13px; cursor:pointer; }
  #sync.ok { background:#25574f; } #sync.pend { background:#765d20; } #sync.err { background:#7a2f3a; }
</style>
</head>
<body>
<section id="login" hidden>
  <h1>Visor de colonoscopia</h1>
  <p class="muted">Inicia sesión con tu cuenta institucional.</p>
  <form id="login-form">
    <label for="em">Correo</label>
    <input id="em" type="email" autocomplete="username" required>
    <label for="pw">Contraseña</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <button type="submit" id="login-btn">Entrar</button>
    <p id="login-err" role="alert"></p>
  </form>
</section>
<div id="app" hidden>
<header>
  <h1>Visor de colonoscopia</h1>
  <span id="status">Sin conexión</span>
  <span id="badge">Sin detección</span>
  <span id="sync" hidden title="Estado de la sincronización con el clúster (clic para reintentar)"></span>
  <span id="who" class="muted"></span><button id="logout">Cerrar sesión</button>
</header>

<main id="main">
  <section>
    <div class="bar" id="pbar" style="margin:0 0 8px">
      <label>ID del paciente <input id="pid" type="text" maxlength="40" size="16" autocomplete="off" placeholder="p. ej. 001"></label>
      <label>Colonoscopia <select id="sesion"><option value="">Nueva (al abrir video o cámara)</option></select></label>
      <span id="sesinfo" class="muted"></span>
    </div>
    <div class="views" id="views">
      <figure id="fig-vid"><figcaption>Original</figcaption><video id="vid" playsinline muted controls></video></figure>
      <figure id="fig-out"><figcaption>Segmentación</figcaption><canvas id="out"></canvas></figure>
    </div>
    <div class="bar">
      <label class="btn">Abrir video<input id="file" type="file" accept="video/*" hidden></label>
      <button id="cam">Usar cámara</button>
      <button id="analysis" class="on">Análisis: activado</button>
      <button id="mode">Modo: máscara</button>
      <button id="annot">Anotación: desactivada</button>
      <button id="tool">Dibujar: pincel</button>
      <button id="save">Guardar marca</button>
      <button id="clear">Borrar marca</button>
      <label>Pincel <input id="brush" type="range" min="3" max="60" value="15"></label>
      <button id="dl">Descargar CSV</button>
      <label>Umbral <input id="thr" type="range" min="5" max="95" value="50"> <span id="thrv">0.50</span></label>
    </div>
    <div class="bar" id="vbar">
      <label>Tamaño del visor <input id="size" type="range" min="30" max="100" value="80"></label>
      <label>Vista <select id="vista"><option value="ambas">Original + segmentación</option><option value="seg">Solo segmentación</option><option value="orig">Solo original</option></select></label>
      <button id="panel">Ocultar panel</button>
      <button id="fs">Pantalla completa</button>
    </div>
    <div class="bar" id="notebar">
      <div id="target" aria-live="polite"></div>
      <button id="mic">Dictar</button>
      <textarea id="nota" rows="2" placeholder="Observación (escribe o dicta). Elige un hallazgo del panel para anotarlo."></textarea>
      <button id="savenote">Guardar nota</button>
      <span id="micst" class="muted" role="status"></span>
    </div>
  </section>
  <aside>
    <h2>Hallazgos (<span id="count">0</span>)</h2>
    <p id="saved" class="empty" aria-live="polite"></p>
    <div id="list"><p class="empty">Aún no hay hallazgos. Se registran cuando aparece un pólipo.</p></div>
    <h2 style="margin-top:14px">Notas (<span id="ncount">0</span>)</h2>
    <div id="nlist"><p class="empty">Sin notas.</p></div>
  </aside>
</main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script>
const $ = id => document.getElementById(id);
const vid = $("vid"), out = $("out"), ctx = out.getContext("2d", { willReadFrequently: true });
const grab = document.createElement("canvas"), gctx = grab.getContext("2d", { willReadFrequently: true });
const maskC = document.createElement("canvas"), mctx = maskC.getContext("2d", { willReadFrequently: true });
const tmp = document.createElement("canvas");
const FPS = 25, MAX_W = 640;   // FPS solo se usa para convertir tiempo <-> número de frame

let ws, seq = 0, inflight = false, analysis = true, mode = "mask", thr = 0.5;
let lastProb = null, lastFrame = null, hadDetection = false, findings = [];
let sesion = "", pid = "", sesionTieneVideo = false, sesionVideo = null, notes = [], tool = "pincel", recorder = null;
let sentKey = 0, shownKey = 0, lastSent = -1, boxStart = null, boxNow = null;
const PID_RE = /^[A-Za-z0-9][A-Za-z0-9._-]{0,39}$/;   // ID que da el hospital
let annotate = false, brush = 15, painting = null, lastPt = null;
const marks = new Map();          // frame -> canvas con la marca manual (blanco = marcado)
let sel = null;                   // hallazgo elegido para ponerle una nota: { key, tipo }

const fmt = s => `${Math.floor(s / 60)}:${(s % 60).toFixed(2).padStart(5, "0")}`;
const blobOf = (c, t) => new Promise(r => c.toBlob(r, t, 0.85));

function connect() {
  const u = new URL("ws", location.href);            // relativa a la página: sirve en / y en /projects/colon_viewe/
  u.protocol = location.protocol === "https:" ? "wss:" : "ws:";
  ws = new WebSocket(u);
  ws.binaryType = "arraybuffer";
  ws.onopen = async () => {
    const t = await token();
    if (!t) { ws.close(); return; }
    ws.send(JSON.stringify({ token: t })); wsAuthed = true;
    $("status").textContent = "Conectado";
  };
  ws.onclose = ev => {
    wsAuthed = false; inflight = false;
    if (!session) return;
    if (ev.code === 4401) { sb.auth.signOut(); return; }
    $("status").textContent = "Desconectado, reintentando…"; setTimeout(connect, 2000);
  };
  ws.onmessage = async ev => {
    const bmp = await createImageBitmap(new Blob([ev.data.slice(4)], { type: "image/png" }));
    maskC.width = bmp.width; maskC.height = bmp.height;
    mctx.drawImage(bmp, 0, 0);
    lastProb = mctx.getImageData(0, 0, bmp.width, bmp.height);
    lastFrame = gctx.getImageData(0, 0, grab.width, grab.height);
    shownKey = sentKey;
    inflight = false;
    const r = render();
    if (r.detected && !hadDetection && !findings.some(f => f.key === shownKey && f.tipo === "automatico"))
      pushFinding({ tipo: "automatico", key: shownKey, box: r.box });
    hadDetection = r.detected;
  };
}

function snapshot() {
  const s = Math.min(1, MAX_W / vid.videoWidth);
  grab.width = Math.round(vid.videoWidth * s); grab.height = Math.round(vid.videoHeight * s);
  gctx.drawImage(vid, 0, 0, grab.width, grab.height);
}

function loop() {
  const changed = vid.currentTime !== lastSent;
  if (vid.readyState >= 2 && vid.videoWidth && (!vid.paused || changed)) {
    if (!analysis) {                       // sin análisis: solo se muestra el frame (y se pueden hacer marcas)
      lastSent = vid.currentTime; snapshot();
      lastFrame = gctx.getImageData(0, 0, grab.width, grab.height); lastProb = null;
      shownKey = Math.round(vid.currentTime * FPS); render();
    } else if (ws && ws.readyState === 1 && wsAuthed && !inflight) {
      lastSent = vid.currentTime; sentKey = Math.round(vid.currentTime * FPS);
      snapshot(); inflight = true;
      grab.toBlob(async b => {
        const jpeg = new Uint8Array(await b.arrayBuffer());
        const msg = new Uint8Array(4 + jpeg.length);
        new DataView(msg.buffer).setUint32(0, ++seq);
        msg.set(jpeg, 4);
        if (ws.readyState === 1) ws.send(msg); else inflight = false;
      }, "image/jpeg", 0.85);
    }
  }
  requestAnimationFrame(loop);
}

function drawMark(c, m, w, h) {
  tmp.width = w; tmp.height = h;
  const t = tmp.getContext("2d");
  t.fillStyle = "#ffd700"; t.fillRect(0, 0, w, h);
  t.globalCompositeOperation = "destination-in"; t.drawImage(m, 0, 0, w, h);
  c.globalAlpha = 0.5; c.drawImage(tmp, 0, 0); c.globalAlpha = 1;
}

function render() {
  if (!lastFrame) return { detected: false, box: null };
  const w = lastFrame.width, h = lastFrame.height;
  const resized = out.width !== w || out.height !== h;
  out.width = w; out.height = h;
  if (resized) fit();
  const img = new ImageData(new Uint8ClampedArray(lastFrame.data), w, h);
  let hits = 0, minX = w, minY = h, maxX = 0, maxY = 0;
  if (lastProb && analysis) {
    const T = thr * 255, d = img.data, p = lastProb.data;
    for (let i = 0, px = 0; i < d.length; i += 4, px++) {
      if (p[i] > T) {
        hits++;
        const x = px % w, y = (px / w) | 0;
        if (x < minX) minX = x; if (x > maxX) maxX = x; if (y < minY) minY = y; if (y > maxY) maxY = y;
        if (mode === "mask") { d[i] = d[i] * .55 + 255 * .45; d[i + 1] *= .55; d[i + 2] *= .55; }
      }
    }
  }
  ctx.putImageData(img, 0, 0);
  const detected = hits > w * h * 2e-4;
  if (mode === "bbox" && detected) {
    ctx.strokeStyle = "#ff3b3b"; ctx.lineWidth = 3;
    ctx.strokeRect(minX, minY, maxX - minX, maxY - minY);
  }
  const m = marks.get(shownKey);
  if (m) drawMark(ctx, m, w, h);
  $("badge").textContent = detected ? "Pólipo detectado" : "Sin detección";
  $("badge").classList.toggle("hit", detected);
  return { detected, box: detected ? [minX, minY, maxX - minX, maxY - minY] : null };
}

/* ---------- anotación manual ---------- */
function ptr(ev) {
  const r = out.getBoundingClientRect(), k = out.width / r.width;
  return [(ev.clientX - r.left) * k, (ev.clientY - r.top) * k];
}
function markCanvas() {
  let m = marks.get(shownKey);
  if (!m) { m = document.createElement("canvas"); m.width = out.width; m.height = out.height; marks.set(shownKey, m); }
  return m;
}
function setForma(m, f) { m.forma = m.forma && m.forma !== f ? "mixta" : f; }
function paintAt(ev) {
  if (!lastFrame) return;
  const m = markCanvas(), [x, y] = ptr(ev), c = m.getContext("2d");
  c.globalCompositeOperation = painting === "erase" ? "destination-out" : "source-over";
  c.strokeStyle = "#fff"; c.lineWidth = 2 * brush; c.lineCap = "round";
  const [x0, y0] = lastPt || [x, y];
  c.beginPath(); c.moveTo(x0, y0); c.lineTo(x, y); c.stroke();
  lastPt = [x, y];
  if (painting !== "erase") setForma(m, "pincel");
  render();
}
function drawBoxPreview() {
  const [x0, y0] = boxStart, [x1, y1] = boxNow;
  ctx.strokeStyle = "#ffd700"; ctx.lineWidth = 2; ctx.setLineDash([6, 4]);
  ctx.strokeRect(Math.min(x0, x1), Math.min(y0, y1), Math.abs(x1 - x0), Math.abs(y1 - y0));
  ctx.setLineDash([]);
}
function endPointer() {
  if (boxStart && boxNow) {
    const [x0, y0] = boxStart, [x1, y1] = boxNow;
    const x = Math.min(x0, x1), y = Math.min(y0, y1), w = Math.abs(x1 - x0), h = Math.abs(y1 - y0);
    if (w > 4 && h > 4) {
      const m = markCanvas(), c = m.getContext("2d");
      c.globalCompositeOperation = "source-over"; c.fillStyle = "#fff"; c.fillRect(x, y, w, h);
      setForma(m, "caja");
    }
    render();
  }
  boxStart = boxNow = null; painting = null; lastPt = null;
}
out.addEventListener("pointerdown", e => {
  if (!annotate || !lastFrame) return;
  out.setPointerCapture(e.pointerId);
  if (e.button === 2) { painting = "erase"; lastPt = null; paintAt(e); return; }   // clic derecho borra, con cualquier herramienta
  if (tool === "caja") { boxStart = boxNow = ptr(e); return; }
  painting = "draw"; lastPt = null; paintAt(e);
});
out.addEventListener("pointermove", e => {
  if (boxStart) { boxNow = ptr(e); render(); drawBoxPreview(); }
  else if (painting) paintAt(e);
});
["pointerup", "pointercancel"].forEach(t => out.addEventListener(t, endPointer));
out.addEventListener("contextmenu", e => { if (annotate) e.preventDefault(); });

function setAnnotate(on) {
  annotate = on;
  if (on) vid.pause();
  $("annot").classList.toggle("warn", on);
  $("annot").textContent = "Anotación: " + (on ? "activada" : "desactivada");
  out.style.cursor = on ? "crosshair" : "default"; out.style.touchAction = on ? "none" : "auto";
}
function setTool(t) { tool = t; $("tool").textContent = "Dibujar: " + t; }

function maskBox(m) {
  const d = m.getContext("2d", { willReadFrequently: true }).getImageData(0, 0, m.width, m.height).data;
  let x0 = m.width, y0 = m.height, x1 = -1, y1 = -1;
  for (let i = 3, px = 0; i < d.length; i += 4, px++) if (d[i] > 0) {
    const x = px % m.width, y = (px / m.width) | 0;
    if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
  }
  if (x1 < 0) return null;
  const k = out.width / m.width;
  return [x0 * k, y0 * k, (x1 - x0 + 1) * k, (y1 - y0 + 1) * k];
}

async function saveMark() {
  const m = marks.get(shownKey), box = m && maskBox(m);
  if (!box) { setSaved("No hay marca en este frame."); return; }
  const mc = document.createElement("canvas"); mc.width = m.width; mc.height = m.height;
  const c = mc.getContext("2d"); c.fillStyle = "#000"; c.fillRect(0, 0, mc.width, mc.height); c.drawImage(m, 0, 0);
  pushFinding({ tipo: "manual", key: shownKey, box, forma: m.forma || "pincel", maskCanvas: mc });
}
function clearMark() { marks.delete(shownKey); render(); }

/* ---------- historial (servidor) ---------- */
function thumbOf(box) {
  const [x, y, bw, bh] = box || [0, 0, out.width, out.height];
  const mx = bw * 0.6 + 15, my = bh * 0.6 + 15;
  const x0 = Math.max(0, x - mx), y0 = Math.max(0, y - my);
  const x1 = Math.min(out.width, x + bw + mx), y1 = Math.min(out.height, y + bh + my);
  const t = document.createElement("canvas"); t.width = 192; t.height = 128;
  t.getContext("2d").drawImage(out, x0, y0, x1 - x0, y1 - y0, 0, 0, 192, 128);
  return t;
}

async function pushFinding({ tipo, key, box, forma = "", maskCanvas }) {
  if (!sesion || !lastFrame) return;
  const thumb = thumbOf(box);
  findings = findings.filter(f => !(f.key === key && f.tipo === tipo));
  findings.push({ key, tipo, src: thumb.toDataURL("image/jpeg", 0.8) });
  findings.sort((a, b) => a.key - b.key);
  renderList();
  const full = document.createElement("canvas"); full.width = lastFrame.width; full.height = lastFrame.height;
  full.getContext("2d").putImageData(lastFrame, 0, 0);            // frame sin dibujos encima
  let predC = null;                                               // copia síncrona: llegan frames nuevos mientras se sube
  if (tipo === "automatico" && lastProb) {
    predC = document.createElement("canvas"); predC.width = maskC.width; predC.height = maskC.height;
    predC.getContext("2d").drawImage(maskC, 0, 0);
  }
  const fd = new FormData();
  fd.append("paciente", pid); fd.append("sesion", sesion); fd.append("frame", key);
  fd.append("tiempo", fmt(key / FPS)); fd.append("tipo", tipo); fd.append("forma", forma);
  if (box) fd.append("box", JSON.stringify(box.map(Math.round)));  // [x, y, ancho, alto] en píxeles de la imagen analizada
  fd.append("ancho", out.width); fd.append("alto", out.height); fd.append("umbral", thr);
  if (predC) fd.append("pred", await blobOf(predC, "image/png"), "p.png");
  fd.append("thumb", await blobOf(thumb, "image/jpeg"), "t.jpg");
  fd.append("frame_img", await blobOf(full, "image/jpeg"), "f.jpg");
  if (maskCanvas) fd.append("mask", await blobOf(maskCanvas, "image/png"), "m.png");
  await enqueue("POST", "/api/findings", fd);                  // se guarda primero en este equipo y se envía al clúster
  if (tipo === "manual") setSaved("Marca guardada; sincronizando con el clúster…");
}

function setSaved(t) { $("saved").textContent = t; }

function renderList() {
  $("count").textContent = findings.length;
  const list = $("list"); list.innerHTML = "";
  if (!findings.length) {
    list.innerHTML = '<p class="empty">Aún no hay hallazgos. Se registran cuando aparece un pólipo o al guardar una marca.</p>';
    return;
  }
  for (const f of findings) {
    const row = document.createElement("div");
    row.className = "find" + (sel && sel.key === f.key && sel.tipo === f.tipo ? " sel" : "");
    row.tabIndex = 0; row.setAttribute("role", "button");
    row.setAttribute("aria-pressed", row.classList.contains("sel"));
    const img = new Image(); img.alt = "Hallazgo"; img.src = f.src;
    const info = document.createElement("span"), tag = document.createElement("b");
    tag.className = "tag " + f.tipo; tag.textContent = f.tipo === "manual" ? "Manual" : "Automático";
    info.append(tag, document.createElement("br"), document.createTextNode(`${fmt(f.key / FPS)} · frame ${f.key}`));
    for (const n of notesOf(f)) {                                   // textContent: nada se interpreta como HTML
      const p = document.createElement("span"); p.className = "fnote"; p.title = n.texto; p.textContent = "📝 " + n.texto;
      info.append(p);
    }
    row.append(img, info);
    row.onclick = () => selectFinding(f);

function alphaFromGray(bmp) {
  const c = document.createElement("canvas"); c.width = bmp.width; c.height = bmp.height;
  const x = c.getContext("2d", { willReadFrequently: true }); x.drawImage(bmp, 0, 0);
  const id = x.getImageData(0, 0, c.width, c.height), d = id.data;
  for (let i = 0; i < d.length; i += 4) { d[i + 3] = d[i]; d[i] = d[i + 1] = d[i + 2] = 255; }
  x.putImageData(id, 0, 0);

}

function startRecording(stream) {      // la cámara en vivo también queda guardada como video original
  if (sesionTieneVideo || !window.MediaRecorder) return;
  const mime = ["video/mp4", "video/webm;codecs=vp9", "video/webm"].find(t => MediaRecorder.isTypeSupported(t));
  if (!mime) return;
  const ext = mime.startsWith("video/mp4") ? ".mp4" : ".webm";
  const qs = `paciente=${encodeURIComponent(pid)}&sesion=${encodeURIComponent(sesion)}&ext=${ext}`;
  let recOff = 0;                      // posición del trozo dentro del archivo: el servidor lo escribe en ese lugar, sin duplicar
  recorder = new MediaRecorder(stream, { mimeType: mime });

  };

}

let loadTok = 0;
const FORMAT_HELP = "Probable causa: códec H.265/HEVC, 10 bits o 4:4:4. Conviértelo a MP4 estándar: ffmpeg -i entrada.mp4 -c:v libx264 -pix_fmt yuv420p -an salida.mp4";

/* ---------- conversión automática de videos que el navegador no reproduce ---------- */
// La copia convertida (MP4/H.264) es solo para verla; el original se sube igual al historial sin tocarlo.
let curFile = null, curUrl = null, convXhr = null, convState = {};      // convState[tok] = "running" | "done"
function playUrl(u) { if (curUrl) URL.revokeObjectURL(curUrl); curUrl = u; vid.src = u; vid.play().catch(() => {}); }
function convertVideo() {                  // true = se está convirtiendo (o se inició ahora); false = no hay nada más que intentar
  const tok = loadTok, f = curFile;
  if (!f || vid.srcObject || convState[tok]) return convState[tok] === "running" || convState[tok] === "failed";   // "failed": ya se mostró el motivo
  convState[tok] = "running";
  const st = t => { if (tok === loadTok) $("status").textContent = t; };
  const fail = t => { convState[tok] = "failed"; st(`No se pudo preparar «${f.name}»: ${t}. ` + FORMAT_HELP); };
  (async () => {
    const ext = (f.name.match(/\.[A-Za-z0-9]{2,5}$/) || [".bin"])[0].toLowerCase();
    const x = convXhr = new XMLHttpRequest();
    x.open("POST", "api/video/compatible?ext=" + encodeURIComponent(ext));
    x.setRequestHeader("Authorization", "Bearer " + await token());
    x.responseType = "blob";
    x.upload.onprogress = e => e.lengthComputable && st(`Formato no compatible: enviando «${f.name}» al servidor… ${Math.round(100 * e.loaded / e.total)}%`);
    x.upload.onload = () => st("Convirtiendo a MP4 en el servidor (puede tardar varios minutos)…");
    x.onprogress = e => e.lengthComputable && st(`Descargando video convertido… ${Math.round(100 * e.loaded / e.total)}%`);
    x.onerror = () => fail("sin conexión con el servidor");
    x.onabort = () => { convState[tok] = "done"; };
    x.onload = async () => {
      if (tok !== loadTok) return;                                      // el médico abrió otro video mientras tanto
      if (x.status === 200) { convState[tok] = "done"; st("Video convertido a MP4 compatible (solo para visualizar)"); playUrl(URL.createObjectURL(x.response)); return; }
      let msg = "HTTP " + x.status;
      try { msg = (JSON.parse(await x.response.text()).detail) || msg; } catch {}
      fail(msg);
    };
    st(`Formato no compatible con el navegador: preparando «${f.name}»…`);
    x.send(f);
  })();

}

/* ---------- sincronización con el clúster ---------- */
// Todo lo que se genera (hallazgos, notas y trozos de video de la cámara) se guarda primero en este equipo (IndexedDB)
// y se envía al clúster en orden; si no hay red o el servidor falla, se reintenta con espera creciente.
// El video de un archivo se sube por trozos y se reanuda desde donde quedó el servidor.
const CHUNK = 8 * 1024 * 1024;
const syncState = { video: null, videoError: "", offline: false, srv: null, pend: 0 };
const nuevoId = () => (window.crypto && crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));

const q = (() => {
  let impl = null;
  const mem = () => { let n = 0, a = []; return {                       // sin IndexedDB (modo privado): solo mientras la pestaña siga abierta
    add: async it => { it.seq = ++n; a.push(it); }, all: async () => a.slice(),
    del: async k => { a = a.filter(i => i.seq !== k); }, put: async it => { a = a.map(i => i.seq === it.seq ? it : i); } }; };
  const idb = db => {
    const tx = (mode, fn) => new Promise((res, rej) => {
      const t = db.transaction("q", mode), r = fn(t.objectStore("q"));
      t.oncomplete = () => res(r.result); t.onerror = t.onabort = () => rej(t.error);
    });
    return { add: it => tx("readwrite", s => s.add(it)), all: () => tx("readonly", s => s.getAll()),
             del: k => tx("readwrite", s => s.delete(k)), put: it => tx("readwrite", s => s.put(it)) };
  };
  const get = () => impl || (impl = new Promise(res => {
    if (typeof indexedDB === "undefined") return res(mem());
    try {
      const r = indexedDB.open("visor-outbox", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("q", { keyPath: "seq", autoIncrement: true });
      r.onsuccess = () => res(idb(r.result)); r.onerror = r.onblocked = () => res(mem());
    } catch { res(mem()); }
  }));
  return { add: async it => (await get()).add(it), all: async () => (await get()).all(),
           del: async k => (await get()).del(k), put: async it => (await get()).put(it) };
})();

function toFD(parts) {
  const fd = new FormData();
  for (const [k, v, name] of parts) name ? fd.append(k, v, name) : fd.append(k, v);
  return fd;
}
async function enqueue(method, url, body) {
  const item = { uid: session && session.user.id, method, url, failed: false, creado: Date.now() };   // uid: nunca se envía con la cuenta de otro usuario
  if (body instanceof FormData) item.parts = [...body.entries()].map(([k, v]) => v instanceof Blob ? [k, v, v.name || "archivo"] : [k, v]);
  else item.body = body;

  draining = true;
  try {
    for (;;) {
      const me = session && session.user.id;
      if (!me) break;
      const it = (await q.all()).find(i => i.uid === me && !i.failed);
      if (!it) { backoff = 2000; syncState.offline = false; setTimeout(refreshEstado, 4000); break; }
      let r = null;
      try { r = await api(it.url, { method: it.method, body: it.body || toFD(it.parts) }); } catch { /* sin red */ }
      if (r && r.ok) { await q.del(it.seq); syncState.offline = false; backoff = 2000; setSync(); continue; }
      if (r && r.status >= 400 && r.status < 500 && ![401, 408, 429].includes(r.status)) {   // el servidor lo rechazó: reintentar no sirve
        it.failed = true; it.error = r.status; await q.put(it); setSync(); continue;
      }
      syncState.offline = !r; scheduleDrain(); break;      // sin red, sesión vencida, 429 o error del servidor
    }
  } finally { draining = false; setSync(); }
}

async function setSync() {
  const el = $("sync");
  if (!session) { el.hidden = true; return; }
  el.hidden = false;
  const mine = (await q.all()).filter(i => i.uid === session.user.id);
  const bad = mine.filter(i => i.failed).length;
  syncState.pend = mine.length - bad;
  const v = syncState.video, s = syncState.srv;
  let txt, cls;
  if (bad || syncState.videoError) {
    txt = syncState.videoError || `${bad} envío(s) rechazado(s) por el servidor · clic para reintentar`; cls = "err";
  } else if (syncState.pend || v) {
    const sinRed = !navigator.onLine || syncState.offline;
    txt = `${sinRed ? "Sin conexión" : "Sincronizando"} · ${syncState.pend} pendiente(s)` +
          (v && v.total ? ` · video ${Math.round(100 * v.sent / v.total)}%` : ""); cls = "pend";
  } else {
    const sb = s && { ok: "metadatos ok", pendiente: "metadatos pendientes", error: "error en metadatos" }[s.supabase];
    txt = "Sincronizado con el clúster" + (sb ? " · " + sb : ""); cls = s && (s.supabase === "pendiente" || s.supabase === "error") ? "pend" : "ok";
  }
  el.textContent = txt; el.className = cls;
}

async function refreshEstado() {                            // lo que el clúster tiene guardado de esta colonoscopia
  if (!sesion || !session) return;
  try {
    const r = await api(`/api/sessions/estado?paciente=${encodeURIComponent(pid)}&sesion=${encodeURIComponent(sesion)}`);
    if (r.ok) { syncState.srv = await r.json(); setSync(); }
  } catch { /* se verá en el próximo intento */ }
}

async function uploadVideo(file) {
  if (sesionTieneVideo) return;
  if (!file.size) { syncState.videoError = "El archivo de video está vacío"; setSync(); return; }
  const myPid = pid, mySes = sesion, me = session && session.user.id;
  const ext = (file.name.match(/\.[A-Za-z0-9]{2,4}$/) || [".mp4"])[0].toLowerCase();
  const base = `/api/sessions/video?paciente=${encodeURIComponent(myPid)}&sesion=${encodeURIComponent(mySes)}&ext=${ext}&total=${file.size}`;
  let off = sesionVideo && sesionVideo.total === file.size ? Math.min(sesionVideo.bytes, file.size) : 0;   // reanuda solo si es el mismo archivo
  let wait = 2000;
  syncState.video = { sent: off, total: file.size }; syncState.videoError = ""; setSync();
  while (off < file.size) {
    if (!session || session.user.id !== me) { syncState.video = null; setSync(); return; }   // sesión cerrada: se reanuda al volver a abrir el archivo
    let r = null;
    try { r = await api(`${base}&offset=${off}`, { method: "PUT", body: file.slice(off, Math.min(off + CHUNK, file.size)) }); } catch { /* sin red */ }
    if (r && r.ok) { off = Math.min(off + CHUNK, file.size); wait = 2000; syncState.offline = false; syncState.video.sent = off; setSync(); continue; }
    if (r && r.status === 409) { const j = await r.json().catch(() => null); off = j && j.bytes >= 0 ? j.bytes : 0; continue; }   // el servidor tiene menos: se reenvía desde ahí
    if (r && [400, 403, 404, 413].includes(r.status)) {
      syncState.video = null;
      syncState.videoError = "No se pudo guardar el video original (" + (r.status === 413 ? "supera el tamaño máximo" : "HTTP " + r.status) + ") · clic para reintentar";
      setSync(); return;
    }
    syncState.offline = !r; setSync();                      // sin red, 401, 429 o 5xx: se espera y se reintenta
    await new Promise(res => setTimeout(res, wait)); wait = Math.min(wait * 2, 60000);
  }
  syncState.video = null;
  if (sesion === mySes) sesionTieneVideo = true;
  setSync(); setSaved("Video original guardado en el clúster."); refreshEstado();
}

$("sync").onclick = async () => {
  if (!session) return;
  for (const it of (await q.all()).filter(i => i.uid === session.user.id && i.failed)) { it.failed = false; await q.put(it); }
  syncState.videoError = ""; backoff = 2000; drain(); refreshEstado();
};
addEventListener("online", () => { backoff = 2000; drain(); });
addEventListener("offline", () => { syncState.offline = true; setSync(); });
addEventListener("beforeunload", e => { if (syncState.video || syncState.pend) { e.preventDefault(); e.returnValue = ""; } });
/* ---------- fin sincronización ---------- */

/* ---------- sesión (Supabase) ---------- */
let sb = null, session = null, wsAuthed = false, started = false;
async function token() { const { data } = await sb.auth.getSession(); return data.session ? data.session.access_token : null; }
async function api(url, opts = {}) {
  return fetch(url.replace(/^\//, ""), { ...opts, headers: { ...(opts.headers || {}), Authorization: "Bearer " + await token() } });
}
async function blobUrl(url) { return URL.createObjectURL(await (await api(url)).blob()); }

function applySession() {
  $("login").hidden = !!session; $("app").hidden = !session;
  if (session) {
    $("who").textContent = session.user.email;
    if (!started) { started = true; loop(); }
    if (!ws || ws.readyState > 1) connect();
    drain(); setSync();
  } else {
    if (ws) ws.close();
    stopCam(); vid.pause(); vid.removeAttribute("src"); vid.load();
    sesion = ""; pid = ""; findings = []; notes = []; sel = null; marks.clear(); lastFrame = lastProb = null; renderList(); renderNotes(); updateTarget();
    $("pid").value = ""; $("sesinfo").textContent = ""; loadSessions(); if (listening) stopDictado();
    syncState.video = null; syncState.srv = null; syncState.videoError = ""; setSync();
  }
}

let cfg = null;
function loginMsg(error) {
  const m = (error.message || "").toLowerCase();
  if (m.includes("invalid login")) return "Correo o contraseña incorrectos.";
  if (m.includes("not confirmed")) return "El correo aún no está confirmado en Supabase.";
  if (m.includes("failed to fetch") || m.includes("networkerror") || m.includes("load failed") || error.name === "AuthRetryableFetchError")
    return "No se pudo conectar con Supabase (" + (cfg && cfg.supabase_url) + "). Revisa SUPABASE_URL en el servidor, " +
           "que el proyecto no esté pausado y que tu red/antivirus/adblock no lo bloqueen.";
  return "Error: " + error.message + (error.status ? " (" + error.status + ")" : "");
}
$("login-form").onsubmit = async e => {
  e.preventDefault();
  $("login-btn").disabled = true; $("login-err").textContent = "";
  try {
    const { error } = await sb.auth.signInWithPassword({ email: $("em").value.trim(), password: $("pw").value });
    if (error) { console.error("Login Supabase:", error); $("login-err").textContent = loginMsg(error); }
  } catch (err) {
    console.error("Login Supabase:", err); $("login-err").textContent = loginMsg(err);
  }
  $("pw").value = ""; $("login-btn").disabled = false;
};
$("logout").onclick = () => sb.auth.signOut();

(async () => {
  $("login").hidden = false;
  try { cfg = await (await fetch("api/config")).json(); }
  catch (e) { $("login-err").textContent = "No se pudo contactar con el servidor (/api/config). ¿Sigue corriendo uvicorn?"; return; }
  if (!cfg.supabase_url || !cfg.supabase_anon_key) { $("login-err").textContent = "El servidor no tiene configurado Supabase (SUPABASE_URL / SUPABASE_ANON_KEY)."; return; }
  if (typeof supabase === "undefined") { $("login-err").textContent = "No se pudo cargar la librería de Supabase (cdn.jsdelivr.net). Revisa tu conexión o adblock."; return; }
  sb = supabase.createClient(cfg.supabase_url, cfg.supabase_anon_key);
  sb.auth.onAuthStateChange((_ev, s) => { session = s; applySession(); });
  session = (await sb.auth.getSession()).data.session; applySession();
})();
</script>
